<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikChat | Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <h1>TikChat</h1>
      <p class="subtitle">Welcome back. Log in to continue chatting.</p>

      <form id="login-form" class="stack-sm">
        <label>
          Email
          <input type="email" id="login-email" placeholder="you@example.com" required />
        </label>

        <label>
          Password
          <input type="password" id="login-password" minlength="6" required />
        </label>

        <button type="submit" class="btn btn-primary">Log In</button>
      </form>

      <p id="login-error" class="form-error" aria-live="polite"></p>
      <p class="switch-link">New here? <a href="signup.html">Create an account</a></p>
    </section>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
