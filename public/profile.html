<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikChat | Profile</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <button id="back-btn" class="btn btn-secondary">← Back</button>
  </header>

  <main class="container with-bottom-space">
    <section id="profile-card" class="profile-card">
      <p id="profile-emoji" class="profile-emoji">⌛</p>
      <h1 id="profile-display-name">Loading...</h1>
      <p id="profile-username" class="subtitle">@username</p>
      <button id="chat-btn" class="btn btn-primary" disabled>Start Chat</button>
    </section>
    <p id="profile-error" class="form-error"></p>
  </main>

  <button id="guide-tab" class="guide-tab" type="button">Guide</button>
  <section id="guide-panel" class="guide-panel hidden" aria-label="Guide panel">
    <h3>Quick Guide</h3>
    <div class="accordion-item">
      <button class="accordion-trigger" type="button">How to change display name?</button>
      <div class="accordion-content">Update the <code>displayName</code> field in your Firestore user document.</div>
    </div>
    <div class="accordion-item">
      <button class="accordion-trigger" type="button">How to change emoji?</button>
      <div class="accordion-content">Update the <code>emoji</code> field in your Firestore user document.</div>
    </div>
    <div class="accordion-item">
      <button class="accordion-trigger" type="button">How to start a chat?</button>
      <div class="accordion-content">Click the <strong>Start Chat</strong> button on this page.</div>
    </div>
    <div class="accordion-item">
      <button class="accordion-trigger" type="button">How to delete account?</button>
      <div class="accordion-content">Account deletion requires deleting the Firebase Auth user and related Firestore data.</div>
    </div>
  </section>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
